  <rect x="12" y="12" width="856" height="536" fill="none" stroke="#4A3C2A" stroke-opacity="0.14"/>

  <line x1="140" y1="34" x2="140" y2="526" stroke="#4A3C2A" stroke-opacity="0.18"/>
  <line x1="742" y1="34" x2="742" y2="526" stroke="#4A3C2A" stroke-opacity="0.14"/>

